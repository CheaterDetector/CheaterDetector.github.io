<!DOCTYPE html>
<html>
<head>
    <title>Secure Basement Portal</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; padding-top: 5vh; }
        .vault { background: #111; padding: 40px; border: 2px solid #00ff41; border-radius: 10px; display: inline-block; box-shadow: 0 0 20px #00ff41; }
        input { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 10px; margin: 10px; text-align: center; font-size: 1.2em; width: 150px; }
        .btn { background: #00ff41; color: #000; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 20px; border: none; }
        .hidden { display: none; }
        .drive-container { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
    <div id="login" class="vault">
        <h1>ACCESS RESTRICTED</h1>
        <p>ENTER SECURITY PIN</p>
        <input type="password" id="pin" maxlength="4" placeholder="****">
        <br>
        <button class="btn" onclick="checkPin()">UNLOCK SYSTEM</button>
    </div>

    <div id="portal" class="vault hidden">
        <h1>SYSTEM ONLINE</h1>
        <p>All Drives Mapped & Ready</p>
        <hr style="border: 1px solid #00ff41;">
        <div id="links">
            <a id="explorerBtn" href="#" target="_blank" class="btn">OPEN FILE EXPLORER</a>
        </div>
    </div>

    <script>
        const BIN_URL = "https://api.jsonbin.io/v3/b/697ff9a443b1c97be95e69e6/latest";

        async function checkPin() {
            const pin = document.getElementById('pin').value;
            if (pin === "777") { // Your PIN
                try {
                    const response = await fetch(BIN_URL);
                    const data = await response.json();
                    const tunnelUrl = data.record.url;
                    
                    document.getElementById('explorerBtn').href = tunnelUrl;
                    document.getElementById('login').classList.add('hidden');
                    document.getElementById('portal').classList.remove('hidden');
                } catch (e) {
                    alert("System Offline: Check Basement PC Connection.");
                }
            } else {
                alert("INVALID PIN - ACCESS DENIED");
            }
        }
    </script>
</body>
</html>
