<!DOCTYPE html>
<html>
<head>
    <title>Basement File Portal</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; text-align: center; padding-top: 15vh; }
        .card { background: #1a1a1a; padding: 40px; border-radius: 20px; display: inline-block; border: 1px solid #333; width: 350px; }
        #status { color: #888; margin: 20px 0; font-size: 1rem; }
        .btn { display: none; background: #007bff; color: white; padding: 18px 30px; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 1.2rem; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Basement Files</h1>
        <p id="status">Connecting to basement PC...</p>
        <a id="explorerBtn" href="#" target="_blank" class="btn">VIEW FILES NOW</a>
    </div>

    <script>
        const BIN_ID = "697ff9a443b1c97be95e69e6"; 

        async function updatePortal() {
            try {
                // Fetch the link from your public bin
                const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
                const d = await r.json();
                const liveUrl = d.record.url;

                if(liveUrl && liveUrl.includes("http")) {
                    document.getElementById('status').innerText = "System Online ✓";
                    document.getElementById('status').style.color = "#28a745";
                    
                    const btn = document.getElementById('explorerBtn');
                    btn.href = liveUrl;
                    btn.style.display = "inline-block";
                }
            } catch(e) { 
                document.getElementById('status').innerText = "Searching for server...";
            }
        }

        updatePortal();
        setInterval(updatePortal, 5000); // Check every 5 seconds
    </script>
</body>
</html>
