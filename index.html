<div style="text-align:center; padding:40px; font-family:sans-serif; background:#111; color:white;">
    <h2>Live File Explorer</h2>
    <p id="status">Connecting to Basement PC...</p>
    <a id="explorerBtn" href="#" target="_blank" style="display:none; padding:15px 30px; background:#007bff; color:white; text-decoration:none; border-radius:8px; font-weight:bold;">
        OPEN FILE EXPLORER
    </a>
</div>

<script>
    async function getLiveLink() {
        const BIN_ID = "697fec9ad0ea881f4099af78"; // Same ID as Python script
        const API_KEY = "$2a$10$0A.tPWYlNG8Ew8BvfXR0z.d9XHZsJn4eGNqG/A2E9nhuNoLlgFcPK"; // Same Key as Python script

        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            });
            const data = await res.json();
            
            if (data.record.url && data.record.url.startsWith("http")) {
                document.getElementById('status').innerText = "System Online";
                const btn = document.getElementById('explorerBtn');
                btn.href = data.record.url;
                btn.style.display = "inline-block";
            }
        } catch (e) {
            document.getElementById('status').innerText = "Basement PC Offline";
        }
    }
    getLiveLink();
</script>
